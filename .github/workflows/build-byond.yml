name: Build and Push BYOND Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=516.1687
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract BYOND version from Dockerfile
        id: byond_version
        run: |
          set -euo pipefail
          VERSION=$(sed -n -E 's/^ENV BYOND_VERSION=([0-9.]+)$/\1/p' Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "Failed to extract BYOND_VERSION from Dockerfile" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update Pterodactyl egg docker_images map
        env:
          BYOND_VERSION: ${{ steps.byond_version.outputs.version }}
        run: |
          set -euo pipefail
          EGG_FILE="egg-generic-b-y-o-n-d-server.json"
          IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME_LC}:${BYOND_VERSION}"

          jq --arg key "BYOND ${BYOND_VERSION}" --arg val "$IMAGE" \
            '.docker_images[$key] = $val' \
            "$EGG_FILE" > "${EGG_FILE}.tmp"
          mv "${EGG_FILE}.tmp" "$EGG_FILE"

      - name: Commit egg update
        run: |
          set -euo pipefail
          if git diff --quiet -- egg-generic-b-y-o-n-d-server.json; then
            echo "No changes to egg file; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egg-generic-b-y-o-n-d-server.json
          git commit -m "chore: add BYOND ${{ steps.byond_version.outputs.version }} to Pterodactyl egg docker_images"
          git push origin HEAD:main
